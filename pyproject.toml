[project]
name = "histos-cli"
version = "0.1.0"
description = "CLI that manages an Obsidian canvas as a shared human-AI task board"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["pywebview>=5.0"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
histos = "histos.cli:main"
histos-gui = "histos.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/histos"]
