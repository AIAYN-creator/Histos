[project]
name = "histos-cli"
version = "0.1.0"
description = "CLI que gestiona un canvas de Obsidian como tablero de tareas compartido humano-IA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
histos = "histos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/histos"]
